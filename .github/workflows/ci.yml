name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m ruff check backend
      - run: python -m mypy backend/app
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build ./backend
      - run: docker build ./frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if secret-like files are tracked
        run: |
          if git ls-files | grep -Ex '\.env' >/dev/null; then
            echo "ERROR: .env must not be committed" >&2
            exit 1
          fi
          if git ls-files | grep -Ei '\.(pem|key)$' >/dev/null; then
            echo "ERROR: key material must not be committed" >&2
            exit 1
          fi
          if git grep -nEi 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}' -- . >/dev/null; then
            echo "ERROR: secret-like content detected in tracked files" >&2
            exit 1
          fi
