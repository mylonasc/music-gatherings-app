name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m ruff check backend
      - run: python -m mypy backend/app
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run test --prefix frontend
      - run: npm run build --prefix frontend

  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion/common/requirements.txt
      - run: pip install -r services/ingestion/common/requirements.txt
      - run: pip install ruff==0.17.4 mypy==2.4.1
      - run: python -m ruff check common fake genius ultimateguitar tests
        working-directory: services/ingestion
      - run: python -m mypy common fake genius ultimateguitar
        working-directory: services/ingestion
      - run: python -m ruff check processor
        working-directory: services
      - run: python -m mypy processor
        working-directory: services
      - run: python -m pytest ingestion/tests processor/tests -q -p no:cacheprovider
        working-directory: services

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build ./backend
      - run: docker build ./frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci --prefix tests/e2e
      - run: npx playwright install --with-deps chromium webkit
        working-directory: tests/e2e
      - run: docker compose up -d --build
      - name: Seed E2E data
        run: |
          docker compose exec -T -e MUSIC_GATHERINGS_BOOTSTRAP_PASSWORD="${E2E_ADMIN_PASSWORD}" backend python -m app.cli create-admin --username root
          SEED_ADMIN_PASSWORD="${E2E_ADMIN_PASSWORD}" npm run --prefix tests/e2e seed
        env:
          E2E_ADMIN_PASSWORD: e2e-admin-ci-pass-1
      - run: npx playwright test
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
      - run: docker compose down -v
        if: always()

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if secret-like files are tracked
        run: |
          if git ls-files | grep -Ex '\.env' >/dev/null; then
            echo "ERROR: .env must not be committed" >&2
            exit 1
          fi
          if git ls-files | grep -Ei '\.(pem|key)$' >/dev/null; then
            echo "ERROR: key material must not be committed" >&2
            exit 1
          fi
          if git grep -nEi 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}' -- . >/dev/null; then
            echo "ERROR: secret-like content detected in tracked files" >&2
            exit 1
          fi
