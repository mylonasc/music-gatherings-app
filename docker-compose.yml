services:
  backend:
    build:
      context: ./backend
    image: music-gatherings-backend:local
    ports:
      # Public API for local development. Published intentionally (see S01).
      - "${MUSIC_GATHERINGS_BACKEND_PORT:-8000}:8000"
    environment:
      MUSIC_GATHERINGS_APP_ENV: ${MUSIC_GATHERINGS_APP_ENV:-development}
      MUSIC_GATHERINGS_DATA_DIR: /data
      # Test-only override for E2E iteration (login attempts are throttled per
      # user; unit tests cover the default of 10). Never raise this in prod.
      MUSIC_GATHERINGS_LOGIN_MAX_ATTEMPTS: ${E2E_LOGIN_MAX_ATTEMPTS:-10}
    volumes:
      - app-data:/data
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: music-gatherings-frontend:local
    ports:
      # Public UI for local development. Nginx proxies /api/* to backend.
      - "${MUSIC_GATHERINGS_FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    image: music-gatherings-backend:local
    # Shares the backend image; entrypoint migrates then execs this command.
    command: ["-m", "app.worker"]
    # Process liveness only, not job-progress/lease health. No worker HTTP server.
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import sys; sys.exit(0 if b'app.worker' in Path('/proc/1/cmdline').read_bytes().split(b'\\0') else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    environment:
      MUSIC_GATHERINGS_APP_ENV: ${MUSIC_GATHERINGS_APP_ENV:-development}
      MUSIC_GATHERINGS_DATABASE_URL: sqlite:////data/database/app.sqlite3
    volumes:
      - app-data:/data
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped
    # No published ports: the worker is only reachable via the private network.

  ingestion-fake:
    build:
      context: ./services/ingestion
      dockerfile: fake/Dockerfile
    image: music-gatherings-ingestion-fake:local
    networks:
      - app-net
    restart: unless-stopped
    # No published ports: deterministic fixture provider for tests/admin panels.
    # Worker/CLI reach it as http://ingestion-fake:8001.

  ingestion-lrclib:
    build:
      context: ./services/ingestion
      dockerfile: lrclib/Dockerfile
    image: music-gatherings-ingestion-lrclib:local
    environment:
      LRCLIB_ALLOW_STORAGE: ${LRCLIB_ALLOW_STORAGE:-true}
      LRCLIB_REQUESTS_PER_MINUTE: ${LRCLIB_REQUESTS_PER_MINUTE:-20}
      LRCLIB_MIN_INTERVAL_SECONDS: ${LRCLIB_MIN_INTERVAL_SECONDS:-0.5}
    networks:
      - app-net
    restart: unless-stopped
    # No published ports: read-only LRCLIB API; no credentials required.

  ingestion-ultimate-guitar:
    build:
      context: ./services/ingestion
      dockerfile: ultimateguitar/Dockerfile
    image: music-gatherings-ingestion-ultimate-guitar:local
    networks:
      - app-net
    restart: unless-stopped
    # No published ports: explicitly disabled (no licensed UG API exists).

  processor:
    build:
      context: ./services
      dockerfile: processor/Dockerfile
    image: music-gatherings-processor:local
    networks:
      - app-net
    restart: unless-stopped
    # No published ports: private normalization/rendering API.

networks:
  app-net:
    driver: bridge

volumes:
  app-data:
